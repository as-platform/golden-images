name: build

on:
  push:
    branches: [main]
    paths: ["images/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["images/**"]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: [self-hosted, homelab]
    outputs:
      stamp: ${{ steps.stamp.outputs.stamp }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: stamp
        run: echo "stamp=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: hadolint
        run: find images -name Dockerfile -print0 | xargs -0 -n1 hadolint --config .hadolint.yaml
      - name: gitleaks
        run: gitleaks detect --source . --no-banner --redact

  build:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: go-builder
            context: images/go-builder
            smoke: "go version && golangci-lint --version && govulncheck -version"
          - name: node-builder
            context: images/node-builder
            smoke: "node -v && corepack --version && git --version"
          - name: python-base
            context: images/python-base
            smoke: "python --version && uv --version"
          - name: github-runner
            context: images/github-runner
            smoke: "cosign version && trivy --version && syft version && gitleaks version && hadolint --version && buildah --version && skopeo --version"
          - name: runtime
            context: images/runtime-distroless
            variant: go
          - name: runtime
            context: images/runtime-distroless
            variant: node
          - name: runtime
            context: images/runtime-distroless
            variant: python
    uses: as-platform/ci-templates/.github/workflows/image-build.yml@main
    with:
      name: ${{ matrix.name }}
      registry: ${{ vars.ZOT_REGISTRY }}
      namespace: golden
      context: ${{ matrix.context }}
      target: ${{ matrix.variant }}
      tags: ${{ matrix.variant && format('{0}-{1} {0}', matrix.variant, needs.lint.outputs.stamp) || format('{0} stable', needs.lint.outputs.stamp) }}
      smoke: ${{ matrix.smoke }}
      push: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
